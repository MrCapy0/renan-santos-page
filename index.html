<!doctype html>
<html lang="pt-br">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>Página de Botões - Fundo Escuro</title>
	<style>
		:root{
			--bg: #0b1020;
			--card: rgba(255,255,255,0.02);
			--yellow: #ffd54a;
			--text: #e6eef8;
			--muted: #9aa7bb;
		}

		*{box-sizing:border-box}
		html,body{height:100%}
		body{
			margin:0;
			background:linear-gradient(180deg,var(--bg) 0%, #07101a 100%);
			color:var(--text);
			font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
			display:flex;
			align-items:center;
			justify-content:center;
			padding:28px;
		}

		.frame{
			width:100%;
			max-width:420px;
			height:80vh;
			background:var(--card);
			border-radius:14px;
			padding:10px;
			box-shadow:0 8px 30px rgba(2,6,23,0.6);
			display:flex;
			flex-direction:column;
			gap:16px;
		}

		.header{
			display:flex;
			align-items:center;
			justify-content:space-between;
		}

		.header h1{
			margin:0;
			font-size:18px;
			letter-spacing:0.2px;
		}

		.header p{margin:0;color:var(--muted);font-size:13px}

		.list{
			display:flex;
			flex-direction:column;
			gap:12px;
			overflow-y:auto;
			padding-right:6px;
			padding-bottom:6px;
		}

		/* Botões */
		.btn{
			appearance:none;
			-webkit-appearance:none;
			border:0;
			background:linear-gradient(180deg,var(--yellow), #f3c03f);
			color:#1b1b1b;
			padding:12px 16px;
			font-weight:600;
			font-size:15px;
			border-radius:10px; /* leve arredondamento */
			cursor:pointer;
			box-shadow:0 6px 18px rgba(255,213,74,0.12);
			transition:transform .12s ease, box-shadow .12s ease;
			text-align:left;
		}

		.btn:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(255,213,74,0.18)}
		.btn:active{transform:translateY(-1px)}
		.btn:focus{outline:3px solid rgba(255,213,74,0.14);outline-offset:3px}

		/* Custom scrollbar (WebKit) */
		.list::-webkit-scrollbar{width:10px}
		.list::-webkit-scrollbar-track{background:transparent}
		.list::-webkit-scrollbar-thumb{background:rgba(255,213,74,0.12);border-radius:10px}

		@media (max-width:480px){
			.frame{height:86vh;padding:16px}
			.btn{font-size:14px;padding:10px 14px}
		}
	</style>
</head>
<body>
	<main class="frame" role="main">
		<div class="header">
			<div>
				<h1>Entrevistas</h1>
				<p></p>
			</div>
		</div>

		<div class="list" role="list" aria-label="Entrevistas">
			<a class="btn" role="listitem" href="https://www.youtube.com/live/PeubtGxpu2k?si=0SPkRBj4bXZAflRn&t=227" target="_blank" rel="noopener">Opção 1</a>
			<a class="btn" role="listitem" href="https://www.youtube.com/live/gV564Fj2Qv0?si=7uYlbmk0Js0SEMQv&t=192" target="_blank" rel="noopener">UOU</a>
			<a class="btn" role="listitem" href="https://youtu.be/jqYhXLXbKao?si=XzhykGQY5d_acoSn&t=40" target="_blank" rel="noopener">Revista Oeste</a>
			<a class="btn" role="listitem" href="https://www.youtube.com/live/5VaafHMjPGU?si=8LHEEcgzS2D8-8cj&t=980" target="_blank" rel="noopener">Opção 4</a>

</body>
</html>
